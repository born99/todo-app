name: 'Release Windows App'
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri App & Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: 'v__VERSION__' # The action automatically replaces __VERSION__ with the version from tauri.conf.json
          releaseName: 'Rust Productivity App v__VERSION__'
          releaseBody: 'Automated Windows build. See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
