<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TickTick Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">✓</span>
        <span class="brand-name">TickTick</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="tasks" onclick="switchTab('tasks', this)">
          <span class="nav-icon">📝</span>
          <span>Inbox</span>
        </button>
        <button class="nav-item" data-tab="calendar" onclick="switchTab('calendar', this)">
          <span class="nav-icon">📅</span>
          <span>Calendar</span>
        </button>
        <button class="nav-item" data-tab="analytics" onclick="switchTab('analytics', this)">
          <span class="nav-icon">📊</span>
          <span>Analytics</span>
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- TASKS TAB -->
      <section id="tab-tasks" class="tab-panel active">
        <div class="panel-header">
          <h1 class="panel-title">Inbox</h1>
          <button class="btn-primary" onclick="openAddModal()">+ Add Task</button>
        </div>

        <div id="task-list" class="task-list">
          <div class="skeleton-loader">
            <div class="skeleton-row"></div>
            <div class="skeleton-row"></div>
            <div class="skeleton-row"></div>
          </div>
        </div>

        <div id="empty-state" class="empty-state" style="display:none">
          <div class="empty-icon">🎉</div>
          <p class="empty-title">All caught up!</p>
          <p class="empty-sub">Add a new task to get started.</p>
        </div>
      </section>

      <!-- CALENDAR TAB -->
      <section id="tab-calendar" class="tab-panel">
        <div class="panel-header">
          <h1 class="panel-title">Calendar</h1>
        </div>
        <div class="calendar-groups">
          <div class="calendar-group">
            <h2 class="group-title">🔔 Scheduled</h2>
            <div id="scheduled-list" class="task-list"></div>
          </div>
          <div class="calendar-group">
            <h2 class="group-title">📋 Unscheduled</h2>
            <div id="unscheduled-list" class="task-list"></div>
          </div>
        </div>
      </section>

      <!-- ANALYTICS TAB -->
      <section id="tab-analytics" class="tab-panel">
        <div class="panel-header">
          <h1 class="panel-title">Analytics</h1>
        </div>
        <div class="analytics-grid">
          <div class="stat-card">
            <span class="stat-number" id="stat-total">0</span>
            <span class="stat-label">Total Tasks</span>
          </div>
          <div class="stat-card accent-green">
            <span class="stat-number" id="stat-done">0</span>
            <span class="stat-label">Completed</span>
          </div>
          <div class="stat-card accent-orange">
            <span class="stat-number" id="stat-pending">0</span>
            <span class="stat-label">Pending</span>
          </div>
          <div class="stat-card accent-purple">
            <span class="stat-number" id="stat-pct">0%</span>
            <span class="stat-label">Completion Rate</span>
          </div>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <span class="progress-label" id="progress-label">0% complete</span>
        </div>
      </section>
    </main>
  </div>

  <!-- ADD TASK MODAL -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title">New Task</h2>
        <button class="modal-close" onclick="closeAddModal()">✕</button>
      </div>
      <form class="modal-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label>Title <span class="required">*</span></label>
          <input id="f-title" class="form-input" placeholder="What needs to be done?" required />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="f-desc" class="form-input form-textarea" placeholder="Add details..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Priority</label>
            <div class="chip-group" id="priority-chips">
              <button type="button" class="chip chip-green" data-value="low" onclick="selectPriority(this)">🟢 Low</button>
              <button type="button" class="chip chip-yellow selected" data-value="medium" onclick="selectPriority(this)">🟡 Medium</button>
              <button type="button" class="chip chip-red" data-value="high" onclick="selectPriority(this)">🔴 High</button>
            </div>
          </div>
          <div class="form-group">
            <label>Duration (minutes)</label>
            <input id="f-duration" class="form-input" type="number" placeholder="e.g. 30" />
          </div>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <div class="chip-group">
            <button type="button" class="chip" onclick="setDueDate('today')">Today 6pm</button>
            <button type="button" class="chip" onclick="setDueDate('tomorrow')">Tomorrow</button>
            <button type="button" class="chip" onclick="setDueDate('week')">Next Week</button>
            <button type="button" class="chip chip-ghost" onclick="setDueDate(null)">Clear</button>
          </div>
          <div class="form-row mt-8">
            <input id="f-due-date" class="form-input" type="date" />
            <input id="f-due-time" class="form-input" type="time" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeAddModal()">Cancel</button>
          <button type="submit" class="btn-primary">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
