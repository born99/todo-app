<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0; padding: 0; overflow: hidden;
      /* Smooth transparent flashing overlay spanning all monitors */
      background: rgba(255, 0, 0, 0.25);
      display: flex; align-items: center; justify-content: center;
      height: 100vh; width: 100vw;
      font-family: 'Inter', system-ui, sans-serif;
      animation: pulse 0.7s infinite alternate;
    }
    @keyframes pulse {
      0% { background: rgba(255, 0, 0, 0.2); }
      100% { background: rgba(255, 0, 0, 0.6); }
    }
    .card {
      background: rgba(20, 20, 30, 0.98);
      border: 3px solid #ff4444; border-radius: 20px;
      padding: 50px; text-align: center; color: white;
      box-shadow: 0 10px 60px rgba(0,0,0,0.8);
      max-width: 800px; width: 80%;
      animation: popIn 0.3s ease-out forwards;
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    h1 { color: #ff4444; font-size: 40px; margin: 0 0 15px 0; letter-spacing: 2px; }
    h2 { font-size: 56px; margin: 0 0 25px 0; }
    p { font-size: 24px; color: #ddd; margin-bottom: 40px; }
    .hint { margin-top: 40px; font-size: 16px; opacity: 0.5; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚨 OVERDUE TASK 🚨</h1>
    <h2 id="title">Fetching...</h2>
    <p id="desc"></p>
    <div class="hint">PRESS ANY KEY OR CLICK ANYWHERE TO CLOSE ALARM</div>
  </div>

  <script>
    const { listen } = window.__TAURI__.event;
    const { invoke } = window.__TAURI__.core;

    let osc, ctx;
    function playAlarm() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        osc = ctx.createOscillator();
        const gainNode = ctx.createGain();
        osc.type = 'square';
        let freq = 800;
        setInterval(() => {
            if(!osc) return;
            freq = freq === 800 ? 1100 : 800;
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
        }, 150);
        gainNode.gain.value = 0.25;
        osc.connect(gainNode);
        gainNode.connect(ctx.destination);
        osc.start();
    }

    // Auto play audio
    playAlarm();

    listen('set-task', (event) => {
        const task = event.payload;
        document.getElementById('title').textContent = task.title;
        document.getElementById('desc').textContent = task.description || '';
    });

    const forceClose = async () => {
        if(osc) { osc.stop(); osc = null; }
        if(ctx) { ctx.close(); }
        await invoke('close_alert');
    };
    
    document.addEventListener('keydown', forceClose);
    document.addEventListener('mousedown', forceClose);
  </script>
</body>
</html>
